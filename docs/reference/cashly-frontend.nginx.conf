# Referensi frontend Cashly dari file yang ikut tersalin ke repo ini.
# Tidak digunakan compose.yaml atau deployment Evolution.
server {
    listen 80;
    server_name staging.cashly.covryzne.dev;

    # Cashly sends receipt images as base64 inside JSON.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
